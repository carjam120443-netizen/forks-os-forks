name: ObsidianOS Installer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  fetch-installer:
    name: Fetch official ObsidianOS installer
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install prerequisites
        run: |
          pacman -Sy --noconfirm --needed curl arch-install-scripts

      - name: Download official ObsidianOS Wizard
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Obsidian-OS/obsidian-wizard/main/obsidian-wizard.py -o obsidian-wizard.py
          test -s obsidian-wizard.py
          chmod +x obsidian-wizard.py
          echo "Official ObsidianOS wizard downloaded successfully."

      - name: Check wizard
        run: |
          head -n 10 obsidian-wizard.py
          sha256sum obsidian-wizard.py

      - name: Upload wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidianos-official-wizard
          path: obsidian-wizard.py
          if-no-files-found: error
