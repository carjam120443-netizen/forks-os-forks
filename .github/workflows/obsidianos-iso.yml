name: Build ObsidianOS Installer ISO

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/obsidianos-iso.yml'
      - 'iso/**'

permissions:
  contents: read

jobs:
  build-iso:
    name: Build bootable ObsidianOS Installer ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ArchISO and build dependencies
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --needed archiso curl python arch-install-scripts

      - name: Prepare ArchISO profile
        run: |
          set -euo pipefail
          rm -rf iso-work
          mkdir -p iso-work
          cp -a /usr/share/archiso/configs/releng iso-work/profile

          mkdir -p iso-work/profile/airootfs/opt/obsidianos
          curl -fsSL \
            https://raw.githubusercontent.com/Obsidian-OS/obsidian-wizard/main/obsidian-wizard.py \
            -o iso-work/profile/airootfs/opt/obsidianos/obsidian-wizard.py
          chmod +x iso-work/profile/airootfs/opt/obsidianos/obsidian-wizard.py

          cat > iso-work/profile/airootfs/usr/local/bin/obsidianos-wizard <<'EOF'
#!/bin/bash
exec python /opt/obsidianos/obsidian-wizard.py "$@"
EOF
          chmod +x iso-work/profile/airootfs/usr/local/bin/obsidianos-wizard

          printf '\npython\ncurl\narch-install-scripts\n' >> iso-work/profile/packages.x86_64
          printf 'ObsidianOS Installer Environment\nRun: obsidianos-wizard\n' > iso-work/profile/airootfs/etc/motd

      - name: Build ISO with mkarchiso
        run: |
          set -euo pipefail
          mkdir -p iso-work/out iso-work/build
          mkarchiso -v -w iso-work/build -o iso-work/out iso-work/profile

      - name: Verify ISO
        run: |
          set -euo pipefail
          ISO=$(find iso-work/out -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          cp "$ISO" ObsidianOS-Installer.iso
          sha256sum ObsidianOS-Installer.iso > ObsidianOS-Installer.iso.sha256
          file ObsidianOS-Installer.iso
          ls -lh ObsidianOS-Installer.iso ObsidianOS-Installer.iso.sha256

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: obsidianos-installer-iso
          path: |
            ObsidianOS-Installer.iso
            ObsidianOS-Installer.iso.sha256
          if-no-files-found: error
          retention-days: 30

      # Trigger a fresh ISO build when this workflow is updated.
